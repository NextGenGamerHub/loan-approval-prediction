{% extends "base.html" %}

{% block title %}Notice - LoanPredict AI{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card-premium p-5 text-center">
                <div class="text-danger mb-3" style="font-size: 3.5rem;">
                    <i class="bi bi-shield-exclamation"></i>
                </div>
                <h2 class="fw-bold mb-2">Error {{ code or 'Notice' }}</h2>
                <p class="text-muted mb-4">{{ message or 'An unexpected error occurred while processing your request.' }}</p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('predict') }}" class="btn btn-primary-custom px-4 py-2">
                        <i class="bi bi-house-door me-1"></i> Return to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
